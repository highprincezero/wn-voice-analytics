name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: voice
          POSTGRES_PASSWORD: voice
          POSTGRES_DB: voice
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U voice -d voice"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      POSTGRES_TEST_URL: postgresql://voice:voice@localhost:5432/voice
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install ffmpeg
        # The api image installs ffmpeg too. mp3, m4a, ogg and flac decoding needs it.
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt -r backend/requirements-dev.txt
      - name: Lint
        run: |
          ruff check backend frontend
          ruff format --check backend frontend
      - name: Test
        working-directory: backend
        run: pytest

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
      - name: Format
        working-directory: infra/terraform
        run: terraform fmt -check -recursive
      - name: Init
        working-directory: infra/terraform
        run: terraform init -backend=false
      - name: Validate
        working-directory: infra/terraform
        run: terraform validate
